    let filteredProducts = [...products]; // في البداية: كل المنتجات

    const productsPerPage = 12;   // nombre produits pour chaque page
    let currentPage = 1;

    const container = document.getElementById("products-container");
    const pagination = document.getElementById("pagination");


    function displayProducts(page) {
      container.innerHTML = "";
      const start = (page - 1) * productsPerPage;
      const end = start + productsPerPage;
      const pageItems = filteredProducts.slice(start, end);

      pageItems.forEach(prod => {
        const div = document.createElement("div");
        div.classList.add("cart-pro");
        div.setAttribute("data-memory", prod.memory);
        div.innerHTML = `
      <img src="${prod.image}" alt="${prod.name}" width="100%" height="auto">
      <div><div class="form-check">
        <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something">
        <label class="form-check-label">Add to cart</label>
      </div></div>
      <h4 class="title-produit">${prod.name}</h4>
      <p>${prod.price}</p>
    `;
        container.appendChild(div);
      });
    }



    function setupPagination() {
      pagination.innerHTML = "";
      const pageCount = Math.ceil(filteredProducts.length / productsPerPage);
      for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        if (i === currentPage) btn.classList.add("active");
        btn.addEventListener("click", () => {
          currentPage = i;
          displayProducts(currentPage);
          setupPagination();
        });
        pagination.appendChild(btn);
      }
    }


    // تشغيل أول مرة
    displayProducts(currentPage);
    setupPagination();






    // hide and show the arow chexbox
    function toggleMemoryFilter() {
      const content = document.getElementById('memory-filter');
      const arrow = document.getElementById('memory-arrow');
      content.style.display = (content.style.display === 'none') ? 'block' : 'none';
      arrow.classList.toggle('fa-chevron-down');
      arrow.classList.toggle('fa-chevron-up');
    }




    const memoryCheckboxes = document.querySelectorAll('.memory-filter');
    memoryCheckboxes.forEach(cb => cb.addEventListener('change', filterProducts));

    function filterProducts() {
      const selectedMemories = Array.from(memoryCheckboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      if (selectedMemories.length === 0) {
        filteredProducts = [...products]; // بدون فلترة
      } else {
        filteredProducts = products.filter(prod =>
          selectedMemories.includes(prod.memory)
        );
      }

      currentPage = 1;
      displayProducts(currentPage);
      setupPagination();
    }



    // hide and show in respensive the advanced search 
    function toggleAdvancedSearch() {
      const filterDiv = document.getElementById('filterSection');
      filterDiv.style.display = (filterDiv.style.display === 'none' || filterDiv.style.display === '') ? 'block' : 'none';
    }
